          echo '87211754e0fa4a31551320462fb01f90b948cac79f7a56490939fe767823bfe0  Rhay-Studio-Setup-NativeAudio-v4.exe' | sha256sum -c -
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Rhay-Studio-Setup-NativeAudio-v4
