          curl -fL --retry 3 "$URL" -o Rhay-Studio-Setup-NativeAudio.exe
          echo '567a062b645df37aa788029fa43037a1637bdea0b22f55bbb76c4364c35b6fce  Rhay-Studio-Setup-NativeAudio.exe' | sha256sum -c -
      - name: Upload installer
        uses: actions/upload-artifact@v4
