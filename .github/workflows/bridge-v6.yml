        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SIGNED_URL" -o Rhay-Studio-Setup-NativeAudio-v6.exe
          echo 'eae89cf97e3ec2c76652384e7c01d11a272d60185422fb3517f9b804b3aa1884  Rhay-Studio-Setup-NativeAudio-v6.exe' | sha256sum -c -
          ls -lh Rhay-Studio-Setup-NativeAudio-v6.exe

      - name: Publier comme artefact temporaire
        uses: actions/upload-artifact@v4
        with:
          name: Rhay-Studio-NativeAudio-v6-EXE
          path: Rhay-Studio-Setup-NativeAudio-v6.exe
          compression-level: 0
          retention-days: 1
