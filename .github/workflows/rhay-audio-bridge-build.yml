name: Build Rhay Audio Bridge APK

on:
  push:
    branches:
      - rhay-audio-bridge-build
    paths:
      - 'rhay-audio-bridge/**'
      - '.github/workflows/rhay-audio-bridge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhay-audio-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rhay-Audio-Bridge-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rhay-Audio-Bridge-v1
          path: rhay-audio-bridge/Rhay-Audio-Bridge-v1.apk
          if-no-files-found: error
