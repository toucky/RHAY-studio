name: Build Rhay Audio Bridge APK

on:
  push:
    branches:
      - rhay-audio-bridge-build
    paths:
      - 'rhay-audio-bridge/**'
      - '.github/workflows/rhay-audio-bridge-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rhay-audio-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Generate compatibility signing key
        run: |
          keytool -genkeypair -v \
            -keystore compat-release.keystore \
            -storepass rhaybridge2026 \
            -keypass rhaybridge2026 \
            -alias rhaybridge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Rhay Audio Bridge, OU=APP MADA, O=APP MADA, L=Antananarivo, C=MG"

      - name: Zipalign and sign v1 v2 v3
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk Rhay-Audio-Bridge-v2-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks compat-release.keystore \
            --ks-key-alias rhaybridge \
            --ks-pass pass:rhaybridge2026 \
            --key-pass pass:rhaybridge2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Rhay-Audio-Bridge-v2.apk \
            Rhay-Audio-Bridge-v2-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Rhay-Audio-Bridge-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rhay-Audio-Bridge-v2
          path: rhay-audio-bridge/Rhay-Audio-Bridge-v2.apk
          if-no-files-found: error
