name: Build RHAY AutoTune CLEAN GOLD native prototype

on:
  workflow_dispatch:
  push:
    branches:
      - autotune-clean-gold-native-prototype
    paths:
      - 'native-gold/**'
      - '.github/workflows/build-native-gold.yml'

jobs:
  android-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RHAY Studio
        uses: actions/checkout@v4

      - name: Checkout Rubber Band 3.3.0 (frozen GOLD engine)
        uses: actions/checkout@v4
        with:
          repository: breakfastquay/rubberband
          ref: v3.3.0
          path: third_party/rubberband

      - name: Install Android NDK
        shell: bash
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Compile-check Java bridge
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="$(find "${ANDROID_SDK_ROOT}/platforms" -maxdepth 1 -type d -name 'android-*' | sort -V | tail -1)"
          test -f "$PLATFORM/android.jar"
          mkdir -p native-gold/java-check
          javac -source 8 -target 8 \
            -cp "$PLATFORM/android.jar" \
            -d native-gold/java-check \
            native-gold/java/mg/appmada/rhaystudio/GoldEngine.java \
            native-gold/java/mg/appmada/rhaystudio/GoldWebBridge.java

      - name: Syntax-check WebView client
        shell: bash
        run: node --check native-gold/web/rhay-gold-client.js

      - name: Build compact arm64-v8a and armeabi-v7a libraries
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          CMAKE_BIN="${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p native-gold/out
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD="native-gold/build-${ABI}"
            "$CMAKE_BIN" -S native-gold -B "$BUILD" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_static \
              -DRUBBERBAND_DIR="$GITHUB_WORKSPACE/third_party/rubberband" \
              -DCMAKE_BUILD_TYPE=Release
            "$CMAKE_BIN" --build "$BUILD" --config Release
            mkdir -p "native-gold/out/${ABI}"
            cp "$BUILD/librhaygold.so" "native-gold/out/${ABI}/librhaygold.so"
            "$STRIP" --strip-unneeded "native-gold/out/${ABI}/librhaygold.so"
          done

      - name: Show final sizes
        shell: bash
        run: find native-gold/out -type f -name '*.so' -exec ls -lh {} \;

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: rhay-gold-native-android
          path: native-gold/out/**
          if-no-files-found: error
