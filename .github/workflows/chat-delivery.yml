          echo 'e78c49a532a582bfd806f167ee6422080f11f1d419d2cca8a45051ad874dae53  Rhay-Studio-Setup-AudioFix.exe' | sha256sum -c -

      - name: Upload EXE
        uses: actions/upload-artifact@v4
