        run: |
          curl -L --fail --retry 3 "$URL" -o Rhay-Studio-Setup-NativeAudio-v10.exe
          echo 'fafdddcc20b88d4b19e990642e79dc50c5c859bc3a6168b5fcec45972b41312c  Rhay-Studio-Setup-NativeAudio-v10.exe' | sha256sum -c -

      - name: Publier comme artefact temporaire
        uses: actions/upload-artifact@v4
