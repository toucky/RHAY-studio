        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
            background: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 6px;
            border: 1px solid #1f2937;
        }
        /* Disable selection & Zoom behaviors */
        body {
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
            touch-action: none;
        }
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: -5px; 
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
        .lyrics-bar {
            background-image: linear-gradient(to right, #6b7280 1px, transparent 1px);
        }
        .lyrics-chunk {
            transition: background-color 0.2s;
            cursor: text;
        }
        .lyrics-chunk:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .lyrics-input-inline {
            background: #1f2937;
            color: #fcd34d;
            border: 1px solid #3b82f6;
            outline: none;
            width: 100%;
            height: 100%;
            padding: 0 4px;
            font-family: monospace;
            font-size: 0.875rem;
        }
        .clip-selected {
            border: 2px solid white !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- LOGIN SCREEN STYLES (Adapted for Dark Theme) --- */
        #login-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #111827; /* Gray 900 */

            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1f2937; /* Gray 800 */
            width: 100%; max-width: 350px;
            padding: 2rem; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);

        .login-icon-box {

            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem auto;
        }

        }
        .info-box {

    <script>
        // --- AUTH & ACTIVATION LOGIC ---
        const app = {
            state: {
                deviceId: null,
                isActivated: false
            },

            init() {
                // 1. Génération ID Appareil
                let dId = localStorage.getItem('rhay_studio_id');
                if (!dId || !dId.includes('-')) {
                    const p1 = Math.random().toString(36).substring(2, 6).toUpperCase().padEnd(4, '0').slice(0, 4);
                    const p2 = Math.random().toString(36).substring(2, 6).toUpperCase().padEnd(4, '0').slice(0, 4);
                    dId = `${p1}-${p2}`;
                    localStorage.setItem('rhay_studio_id', dId);
                }
                this.state.deviceId = dId;
                document.getElementById('device-id-display').innerText = dId;

                // 2. Vérification Activation
                const code = localStorage.getItem('rhay_studio_code');
                if (code && this.verifyCode(dId, code)) {
                    this.state.isActivated = true;
                    this.showApp();
                } else {
                    this.showLogin();
                }
            },

            verifyCode(id, input) {
                if (input === 'RHAY-STUDIO-MASTER') return true; // Code secours
                try {
                    const cleanInput = input.trim().replace(/[\s]/g, '').toUpperCase();
                    const cleanInputNoDash = cleanInput.replace(/-/g, '');

                    // Algorithme 
                    const [p1, p2] = id.split('-');
                    if(!p1 || !p2) return false;
                    
                    const revP1 = p1.split('').reverse().join('');
                    const revP2 = p2.split('').reverse().join('');
                    
                    // Code = 0M + Inv(P2) + A9-0D + Inv(P1) + A6
                    const expectedStrict = `0M${revP2}A9-0D${revP1}A6`;
                    const expectedNoDash = expectedStrict.replace(/-/g, '');
                    
                    return (cleanInput === expectedStrict) || (cleanInputNoDash === expectedNoDash);
                } catch(e) { return false; }
            },

            login() {
                const input = document.getElementById('activation-code').value;
                if (this.verifyCode(this.state.deviceId, input)) {
                    localStorage.setItem('rhay_studio_code', input);
                    this.state.isActivated = true;
                    this.showApp();
                } else {
                    alert("Code incorrect / Kaody diso.");
                }
            },

            logout() {
                if(confirm("Verrouiller le studio ? / Hidiana ?")) {
                    localStorage.removeItem('rhay_studio_code');
                    location.reload();
                }
            },

            showApp() {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'flex';
                initState(); // Démarrage du studio
            },

            showLogin() {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-content').style.display = 'none';
            }
        };

        let currentLang = 'fr';

        function t(key) { return TRANSLATIONS[currentLang][key] || key; }

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(TRANSLATIONS[currentLang][key]) {
                    el.innerHTML = TRANSLATIONS[currentLang][key];
                }
            });
            const lyricsInput = document.getElementById('lyrics-input');

            document.getElementById('btn-load-project').title = t('open_tooltip');
            document.getElementById('btn-export').title = t('export');

            tracks.forEach((track, i) => {
                const defaultNameFr = TRANSLATIONS['fr'].track_default_name + " " + (i+1);
                const defaultNameMg = TRANSLATIONS['mg'].track_default_name + " " + (i+1);
                if(track.name === defaultNameFr || track.name === defaultNameMg) {
                    track.name = t('track_default_name') + " " + (i+1);
                }
            });
            renderTrackControls();
            updateTransportUI();

        // --- STATE & AUDIO ---
        let audioCtx = null;
        let masterGain = null;
        let micStream = null;
        let analyser = null;

        let isRecording = false;

        let playbackStartPosition = 0;

        // --- CORE FUNCTIONS ---

        function togglePlay() {

        function toggleRecord() {

                startRecordingLogic(armedTrack.id);

        function toggleArm(id) {

        }

        function toggleMute(id) {
            const t = tracks.find(x => x.id === id);

        }

        function toggleSolo(id) {
            const t = tracks.find(x => x.id === id);
            t.isSolo = !t.isSolo;

        // --- INITIALIZATION ---
        function initState() {

                tracks.push({
                    id: i,

                    isMuted: false,

        async function initAudio() {
            const debugEl = document.getElementById('debug-msg');
            if (audioCtx && micStream) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Erreur: API Audio non supportée (HTTPS requis).");
                return;
            }
            try {
                if(!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext(); 
                    SAMPLE_RATE = audioCtx.sampleRate;
                    masterGain = audioCtx.createGain();
                    masterGain.connect(audioCtx.destination);
                }
                if(audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                const constraints = { audio: true }; 
                if (!micStream) {
                    micStream = await navigator.mediaDevices.getUserMedia(constraints);
                }
                document.getElementById('init-overlay').classList.add('hidden');
            } catch (err) {
                if(audioCtx) {
                    try { await audioCtx.close(); } catch(e){}
                    audioCtx = null;

                micStream = null;
                let msg = err.message;
                if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {

        function renderTimelineTracks() {

        function setupRuler() {

        // ... (Listeners for zoom, split, delete etc. unchanged from previous working block) ...
        document.getElementById('timeline-scroll-area').addEventListener('click', (e) => {

        document.getElementById('btn-split').addEventListener('click', () => {
            if(!selectedClip || !audioCtx) return;
            const track = tracks.find(t => t.id === selectedClip.trackId);
            const clip = track.clips[selectedClip.clipIndex];
            if (currentTime <= clip.start || currentTime >= clip.start + clip.duration) {
                alert(t('alert_cut_pos'));
                return;
            }
            const splitPoint = currentTime - clip.start;
            const originalBuffer = clip.buffer;
            const sliceBuffer = (buffer, begin, end) => {
                const rate = buffer.sampleRate;
                const frameCount = Math.floor((end - begin) * rate);
                if(frameCount <= 0) return null;
                const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, frameCount, rate);
                const offset = Math.floor(begin * rate);
                for(let i=0; i<buffer.numberOfChannels; i++) {
                    newBuffer.copyToChannel(buffer.getChannelData(i).subarray(offset, offset + frameCount), i);
                }
                return newBuffer;
            };
            const buffer1 = sliceBuffer(originalBuffer, 0, splitPoint);
            const buffer2 = sliceBuffer(originalBuffer, splitPoint, clip.duration);
            if(!buffer1 || !buffer2) return;
            track.clips.splice(selectedClip.clipIndex, 1);
            track.clips.push({ start: clip.start, buffer: buffer1, duration: buffer1.duration, name: clip.name + " (1)" });
            track.clips.push({ start: currentTime, buffer: buffer2, duration: buffer2.duration, name: clip.name + " (2)" });
            track.clips.sort((a,b) => a.start - b.start);
            selectedClip = null;
            renderTimeline();
        });
        document.getElementById('btn-delete').addEventListener('click', () => {
            if(!selectedClip) return;
            const track = tracks.find(t => t.id === selectedClip.trackId);
            track.clips.splice(selectedClip.clipIndex, 1);
            selectedClip = null;
            renderTimeline();
        });

        // --- LYRICS LOGIC ---
        function getPixelsPerBar() {
            const beatsPerSec = bpm / 60;
            const secPerBeat = 1 / beatsPerSec;
            const secPerBar = secPerBeat * 4; 
            return secPerBar * pixelsPerSecond;
        }
        function updateLyricsDisplay() {
            const lane = document.getElementById('lyrics-lane');
            const sidebarHeader = document.getElementById('lyrics-sidebar-header');
            if(!showLyrics) { lane.classList.add('hidden'); sidebarHeader.classList.add('hidden'); return; }
            lane.classList.remove('hidden'); sidebarHeader.classList.remove('hidden'); lane.innerHTML = '';
            const pixelsPerBar = getPixelsPerBar();
            lane.style.backgroundSize = `${pixelsPerBar}px 100%`;
            lyricsChunks.forEach((text, index) => {
                if(!text || text.trim() === "") return; 
                const chunkEl = document.createElement('div');
                chunkEl.className = "lyrics-chunk absolute top-0 bottom-0 flex items-center px-2 text-sm font-mono text-yellow-300 border-l border-gray-500/50 whitespace-nowrap overflow-hidden";
                chunkEl.style.left = `${index * pixelsPerBar}px`;
                chunkEl.style.width = `${pixelsPerBar}px`;
                chunkEl.innerText = text;
                chunkEl.dataset.index = index;
                lane.appendChild(chunkEl);
            });
        }
        const lyricsLane = document.getElementById('lyrics-lane');
        lyricsLane.addEventListener('dblclick', function(e) {
            const laneRect = document.getElementById('timeline-content').getBoundingClientRect();
            const clickX = e.clientX - laneRect.left;
            const pixelsPerBar = getPixelsPerBar();
            const barIndex = Math.floor(clickX / pixelsPerBar);
            while(lyricsChunks.length <= barIndex) lyricsChunks.push("");
            const currentValue = lyricsChunks[barIndex] || "";
            const existingInput = document.querySelector('.lyrics-input-inline');
            if(existingInput) existingInput.blur(); 
            let targetEl = document.querySelector(`.lyrics-chunk[data-index="${barIndex}"]`);
            if(!targetEl) {
                targetEl = document.createElement('div');
                targetEl.className = "lyrics-chunk absolute top-0 bottom-0 flex items-center px-2 border-l border-gray-500/50";
                targetEl.style.left = `${barIndex * pixelsPerBar}px`;
                targetEl.style.width = `${pixelsPerBar}px`;
                targetEl.dataset.index = barIndex;
                lyricsLane.appendChild(targetEl);
            }
            targetEl.innerHTML = '';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentValue;
            input.className = 'lyrics-input-inline';
            input.placeholder = '...';
            targetEl.appendChild(input);
            input.focus();
            const save = () => {
                const newVal = input.value;
                lyricsChunks[barIndex] = newVal;
                document.getElementById('lyrics-input').value = lyricsChunks.join(' | ');
                updateLyricsDisplay();
            };
            input.addEventListener('blur', save);
            input.addEventListener('keydown', (evt) => { if(evt.key === 'Enter') input.blur(); });
        });

        // --- AUDIO ENGINE CORE ---
        function play() {
            if(!audioCtx) return;
            stopSources();
            startTimeRef = audioCtx.currentTime;
            startOffsetRef = currentTime;
            playbackStartPosition = currentTime; 
            nextNoteTime = audioCtx.currentTime; 
            tracks.forEach(track => {
                if (track.isMuted) return;
                const soloExists = tracks.some(t => t.isSolo);
                if (soloExists && !track.isSolo) return;
                track.clips.forEach(clip => {
                    const clipEnd = clip.start + clip.duration;
                    if (currentTime < clipEnd) {
                        const source = audioCtx.createBufferSource();
                        source.buffer = clip.buffer;
                        const gainNode = audioCtx.createGain();
                        gainNode.gain.value = track.volume;
                        source.connect(gainNode);
                        gainNode.connect(masterGain);
                        let whenToStart = 0; let offsetInClip = 0; 
                        if (currentTime > clip.start) { whenToStart = 0; offsetInClip = currentTime - clip.start; }
                        else { whenToStart = clip.start - currentTime; offsetInClip = 0; }
                        source.start(audioCtx.currentTime + whenToStart, offsetInClip);
                        activeSources.push(source);
                    }
                });
            });
            isPlaying = true;
            updateTransportUI();
            startAnimationLoop();
        }
        function stop() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            stopSources();
            isPlaying = false;
            isRecording = false;
            cancelAnimationFrame(requestAnimId);
            if(currentRecordingClip) {
                const canvas = document.getElementById(`rec-canvas-${currentRecordingClip.trackId}`);
                if(canvas) canvas.remove();
                currentRecordingClip = null;
            }
            if(document.getElementById('chk-auto-return').checked) {
                currentTime = playbackStartPosition;
                startOffsetRef = playbackStartPosition;
            }
            updateTransportUI();
            updatePlayhead();
            updateTimeDisplay();
        }
        function stopSources() { activeSources.forEach(s => { try{s.stop()}catch(e){} }); activeSources = []; }
        function scheduleMetronome() {
            if(!isMetronomeOn || !isPlaying) return;
            const secondsPerBeat = 60.0 / bpm;
            const lookahead = 0.1; 
            while (nextNoteTime < audioCtx.currentTime + lookahead) { playClick(nextNoteTime); nextNoteTime += secondsPerBeat; }
        }
        function playClick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(masterGain);
            osc.frequency.value = 1000; gain.gain.value = 0.5; 
            osc.start(time);
            osc.stop(time + 0.05);
            activeSources.push(osc);
        }
        async function startRecordingLogic(trackId) {
            if (!micStream || !audioCtx) return;
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            play();
            isRecording = true;
            updateTransportUI();
            const input = audioCtx.createMediaStreamSource(micStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            input.connect(analyser);
            let options = {};
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType: 'audio/webm;codecs=opus' };
            else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
            try { mediaRecorder = new MediaRecorder(micStream, options); }
            catch (e) { try { mediaRecorder = new MediaRecorder(micStream); } catch(e2) { alert(t('err_codec') + " " + e2.message); return; } }
            recordedChunks = [];
            const recordStartTime = currentTime;
            const lane = document.getElementById(`timeline-lane-${trackId}`);
            const canvas = document.createElement('canvas');
            canvas.id = `rec-canvas-${trackId}`;
            canvas.className = "absolute top-1 bottom-1 rounded-r-md border-r-2 border-red-500 bg-red-900/30 z-20";
            canvas.height = 90;
            canvas.style.left = `${recordStartTime * pixelsPerSecond}px`;
            lane.appendChild(canvas);
            currentRecordingClip = { trackId, start: recordStartTime, canvas: canvas, ctx: canvas.getContext('2d'), data: [] };
            mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                let blobType = mediaRecorder.mimeType || 'audio/webm';
                if (!blobType && recordedChunks.length > 0) blobType = recordedChunks[0].type;
                const blob = new Blob(recordedChunks, { type: blobType });
                try {
                    const arrayBuffer = await blob.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    const track = tracks.find(t => t.id === trackId);
                    track.clips.push({ start: recordStartTime, buffer: audioBuffer, duration: audioBuffer.duration, name: "Rec " + new Date().toLocaleTimeString() });
                    renderTimeline();
                } catch (decodeErr) { console.error("Decode error:", decodeErr); alert(t('err_decode') + " Type: " + blobType); }
            };
            mediaRecorder.start(50);
        }
        function startAnimationLoop() {
            if(requestAnimId) cancelAnimationFrame(requestAnimId);
            function loop() {
                if(!audioCtx) return;
                const now = audioCtx.currentTime;
                const exactTime = (now - startTimeRef) + startOffsetRef;
                currentTime = exactTime;
                updatePlayhead();
                updateTimeDisplay();
                if(isMetronomeOn) scheduleMetronome();
                if(isRecording && currentRecordingClip && analyser) drawLiveWaveform();
                if(isPlaying || isRecording) requestAnimId = requestAnimationFrame(loop);
            }
            loop();
        }
        function drawLiveWaveform() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteTimeDomainData(dataArray);
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) sum += Math.abs( (dataArray[i] - 128) / 128 );
            const amp = sum / dataArray.length;
            const clip = currentRecordingClip;
            clip.data.push(amp);
            const durationSoFar = currentTime - clip.start;
            const width = durationSoFar * pixelsPerSecond;
            clip.canvas.style.width = `${width}px`;
            clip.canvas.width = width;
            const ctx = clip.ctx;
            const h = clip.canvas.height;
            const w = clip.canvas.width;
            ctx.clearRect(0,0,w,h);
            ctx.beginPath();
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 2;
            const step = w / clip.data.length;
            ctx.moveTo(0, h/2);
            for(let i=0; i<clip.data.length; i++) {
                const height = clip.data[i] * h; 
                ctx.lineTo(i * step, (h/2) - (height/2));
                ctx.lineTo(i * step, (h/2) + (height/2));
            }
            ctx.stroke();
        }
        function updatePlayhead() {
            const playhead = document.getElementById('playhead');
            const pos = currentTime * pixelsPerSecond;
            playhead.style.left = `${pos}px`;
            const scrollArea = document.getElementById('timeline-scroll-area');
            const viewWidth = scrollArea.clientWidth;
            const scrollLeft = scrollArea.scrollLeft;
            if (pos > scrollLeft + viewWidth - 50) scrollArea.scrollLeft = pos - 100;
        }
        function updateTimeDisplay() {
            const sec = Math.floor(currentTime % 60);
            const min = Math.floor(currentTime / 60);
            const ms = Math.floor((currentTime % 1) * 10);
            const txt = `${min}:${sec < 10 ? '0'+sec : sec}.${ms}`;
            document.getElementById('time-display').innerText = txt;
        }
        function triggerImport(trackId) {
            importTargetTrackId = trackId;
            document.getElementById('file-import').click();
        }
        document.getElementById('file-import').addEventListener('change', function(e) {
            if(!audioCtx) initAudio(); 
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const arrayBuffer = evt.target.result;
                try {
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    const track = tracks.find(t => t.id === importTargetTrackId);
                    track.clips.push({ start: 0, buffer: audioBuffer, duration: audioBuffer.duration, name: file.name });
                    renderTimeline();
                } catch(err) { alert(t('err_decode') + err); }
            };
            reader.readAsArrayBuffer(file);
            this.value = null;
        });

        // --- EXPORT/SAVE HELPERS ---
        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            buffer = new ArrayBuffer(length),
            view = new DataView(buffer),
            channels = [], i, sample, offset = 0, pos = 0;
            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan); setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
            for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
            while(pos < length) {
                for(i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], {type: "audio/wav"});
            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        }
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // --- UPDATED EXPORT/SAVE LOGIC ---
        async function saveProject() {
            if(isRecording) return;
            if(!audioCtx) return;
            
            const filename = await askFilename("projet_rhay", 'project_name_prompt');
            if(!filename) return;
            const safeFilename = filename.endsWith('.rhay') ? filename : filename + ".rhay";

            const projectData = { version: "1.0", bpm: bpm, lyricsChunks: lyricsChunks, tracks: [] };
            for (const t of tracks) {
                const serializedClips = [];
                for (const c of t.clips) {
                    const wavBlob = bufferToWave(c.buffer, c.buffer.length);
                    const base64Data = await blobToBase64(wavBlob);
                    serializedClips.push({ start: c.start, duration: c.duration, name: c.name, data: base64Data });
                }
                projectData.tracks.push({ id: t.id, name: t.name, color: t.color, volume: t.volume, isMuted: t.isMuted, isSolo: t.isSolo, clips: serializedClips });
            }
            
            const jsonStr = JSON.stringify(projectData);
            const blob = new Blob([jsonStr], {type: "application/json"});

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({ suggestedName: safeFilename, types: [{ description: 'Projet RHAY', accept: {'application/json': ['.rhay']}, }], });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return; 
                } catch (err) { if (err.name !== 'AbortError') console.log("Fallback save..."); else return; }
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = safeFilename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); alert(t('save_success')); }, 3000); // 3s delay for Android
        }

        function triggerLoadProject() {
            if(isRecording) return;
            document.getElementById('project-import').click();
        }
        document.getElementById('project-import').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try { const projectData = JSON.parse(evt.target.result); await restoreProject(projectData); } catch(err) { alert("Erreur fichier projet: " + err); }
            };
            reader.readAsText(file);
            this.value = null;
        });
        async function restoreProject(data) {
            if(!audioCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE }); masterGain = audioCtx.createGain(); masterGain.connect(audioCtx.destination); }
            bpm = data.bpm || 120; document.getElementById('bpm-input').value = bpm; lyricsChunks = data.lyricsChunks || []; tracks = []; 
            for(const tData of data.tracks) {
                const newTrack = { id: tData.id, name: tData.name, color: tData.color, volume: tData.volume, isMuted: tData.isMuted, isSolo: tData.isSolo, isArmed: false, clips: [] };
                for(const cData of tData.clips) {
                    const res = await fetch(cData.data);
                    const arrayBuff = await res.arrayBuffer();
                    const audioBuff = await audioCtx.decodeAudioData(arrayBuff);
                    newTrack.clips.push({ start: cData.start, duration: cData.duration, name: cData.name, buffer: audioBuff });
                }
                tracks.push(newTrack);
            }
            updateLyricsDisplay(); renderUI(); alert("Projet chargé !");
        }

        async function exportToWav() {
            if(isRecording) return;
            if(!audioCtx) return;
            let maxDuration = 0; tracks.forEach(t => { t.clips.forEach(c => { if(c.start + c.duration > maxDuration) maxDuration = c.start + c.duration; }); });
            if(maxDuration === 0) { alert(t('nothing_export')); return; }
            
            const filename = await askFilename("rhay_studio_mix", 'filename_prompt');
            if(!filename) return;
            const safeFilename = filename.endsWith('.wav') ? filename : filename + ".wav";
            
            const offlineCtx = new OfflineAudioContext(2, maxDuration * SAMPLE_RATE, SAMPLE_RATE);
            tracks.forEach(track => {
                if(track.isMuted) return;
                track.clips.forEach(clip => {
                    const source = offlineCtx.createBufferSource();
                    source.buffer = clip.buffer;
                    const gain = offlineCtx.createGain();
                    gain.gain.value = track.volume;
                    source.connect(gain);
                    gain.connect(offlineCtx.destination);
                    source.start(clip.start);
                });
            });
            const renderedBuffer = await offlineCtx.startRendering();
            const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({ suggestedName: safeFilename, types: [{ description: 'Fichier Audio WAV', accept: {'audio/wav': ['.wav']}, }], });
                    const writable = await handle.createWritable();
                    await writable.write(wavBlob);
                    await writable.close();
                    return; 
                } catch (err) { if (err.name !== 'AbortError') console.log("Fallback export..."); else return; }
            }

            const url = URL.createObjectURL(wavBlob);
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = url;
            link.download = safeFilename;
            document.body.appendChild(link);
            link.click();
            setTimeout(() => { document.body.removeChild(link); window.URL.revokeObjectURL(url); alert(t('export_success')); }, 3000);
        }

        // --- BUTTON BINDINGS ---
        document.getElementById('btn-lang').addEventListener('click', function() { currentLang = currentLang === 'fr' ? 'mg' : 'fr'; updateTexts(); });
        document.getElementById('btn-init').addEventListener('click', initAudio);
        document.getElementById('btn-play').addEventListener('click', togglePlay);
        document.getElementById('btn-record').addEventListener('click', toggleRecord);
        document.getElementById('btn-rewind').addEventListener('click', () => { currentTime = 0; startOffsetRef = 0; playbackStartPosition = 0; updatePlayhead(); updateTimeDisplay(); });
        document.getElementById('btn-export').addEventListener('click', exportToWav);
        document.getElementById('btn-save-project').addEventListener('click', saveProject);
        document.getElementById('btn-load-project').addEventListener('click', triggerLoadProject);
        document.getElementById('bpm-input').addEventListener('change', (e) => { bpm = parseInt(e.target.value); updateLyricsDisplay(); });
        document.getElementById('btn-metronome').addEventListener('click', function() { isMetronomeOn = !isMetronomeOn; this.className = isMetronomeOn ? "text-green-400 transition" : "text-gray-500 hover:text-white transition"; });
        
        // Timeline Click Bindings
        document.getElementById('timeline-scroll-area').addEventListener('click', (e) => {
            if(e.target.id === 'timeline-content' || e.target.id === 'grid-bg' || e.target.id.startsWith('timeline-lane')) {
                if(isRecording) return; 
                selectedClip = null;
                renderTimelineTracks();
                updateEditToolsState();
            }
        });
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            if(isRecording) return; 
            if(pixelsPerSecond < 200) { pixelsPerSecond += 10; renderTimeline(); }
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            if(isRecording) return; 
            if(pixelsPerSecond > 10) { pixelsPerSecond -= 10; renderTimeline(); }
        });
        document.getElementById('btn-split').addEventListener('click', () => {
            if(!selectedClip || !audioCtx) return;
            const track = tracks.find(t => t.id === selectedClip.trackId);
            const clip = track.clips[selectedClip.clipIndex];
            if (currentTime <= clip.start || currentTime >= clip.start + clip.duration) {
                alert(t('alert_cut_pos'));
                return;
            }
            const splitPoint = currentTime - clip.start;
            const originalBuffer = clip.buffer;
            const sliceBuffer = (buffer, begin, end) => {
                const rate = buffer.sampleRate;
                const frameCount = Math.floor((end - begin) * rate);
                if(frameCount <= 0) return null;
                const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, frameCount, rate);
                const offset = Math.floor(begin * rate);
                for(let i=0; i<buffer.numberOfChannels; i++) {
                    newBuffer.copyToChannel(buffer.getChannelData(i).subarray(offset, offset + frameCount), i);
                }
                return newBuffer;
            };
            const buffer1 = sliceBuffer(originalBuffer, 0, splitPoint);
            const buffer2 = sliceBuffer(originalBuffer, splitPoint, clip.duration);
            if(!buffer1 || !buffer2) return;
            track.clips.splice(selectedClip.clipIndex, 1);
            track.clips.push({ start: clip.start, buffer: buffer1, duration: buffer1.duration, name: clip.name + " (1)" });
            track.clips.push({ start: currentTime, buffer: buffer2, duration: buffer2.duration, name: clip.name + " (2)" });
            track.clips.sort((a,b) => a.start - b.start);
            selectedClip = null;
            renderTimeline();
        });
        document.getElementById('btn-delete').addEventListener('click', () => {
            if(!selectedClip) return;
            const track = tracks.find(t => t.id === selectedClip.trackId);
            track.clips.splice(selectedClip.clipIndex, 1);
            selectedClip = null;
            renderTimeline();
        });

        // Lyrics Modal Bindings
        const lyricsModal = document.getElementById('lyrics-modal');
        document.getElementById('btn-lyrics-modal').addEventListener('click', () => { lyricsModal.classList.remove('hidden'); });
        document.getElementById('btn-close-lyrics').addEventListener('click', () => { lyricsModal.classList.add('hidden'); });
        document.getElementById('btn-save-lyrics').addEventListener('click', () => { const rawVal = document.getElementById('lyrics-input').value; lyricsChunks = rawVal.split('|').map(s => s.trim()); showLyrics = true; document.getElementById('chk-show-lyrics').checked = true; updateLyricsDisplay(); lyricsModal.classList.add('hidden'); });
        document.getElementById('chk-show-lyrics').addEventListener('change', (e) => { showLyrics = e.target.checked; updateLyricsDisplay(); });
        document.getElementById('ruler').addEventListener('click', (e) => {
            if(isRecording) return; 
            const rect = e.currentTarget.getBoundingClientRect();
            const container = document.getElementById('timeline-scroll-area');
            const x = e.clientX - rect.left + container.scrollLeft;
            const newTime = x / pixelsPerSecond;
            currentTime = newTime; startOffsetRef = newTime; playbackStartPosition = newTime; 
            if(isPlaying) { stop(); play(); } else { updatePlayhead(); updateTimeDisplay(); }
        });

        // Initialize App Login Check
        app.init();
    </script>
</body>
